[project]
name = "keycheat"
version = "0.1.0"
description = "Render a TOML keyboard-shortcut config into a newspaper-column HTML/PDF cheat sheet"
readme = "README.md"
license = { file = "license.txt" }
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "reportlab>=5.0.1",
]

[project.scripts]
keycheat = "keycheat:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
