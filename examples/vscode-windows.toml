# keycheat config
#
# Top-level metadata (all optional):
#   title    - big heading at the top of the sheet
#   subtitle - smaller line under the title
#   leader   - a prefix string. Any shortcut key that contains the literal
#              token <leader> will have it replaced with this value, similar
#              to the <leader> key in Neovim. Handy for chorded shortcuts
#              like VS Code's "Ctrl+K, ..." family below.
#   footer   - small print at the bottom of the sheet
#
# Every other top-level table becomes one section on the sheet, in the order
# it appears in this file. Inside a section, each entry is:
#   "key combo" = "description"

title = "Visual Studio Code"
subtitle = "Keyboard shortcuts for Windows"
leader = "Ctrl+K"
footer = "Other operating systems' shortcuts: aka.ms/vscodekeybindings"

["General"]
"Ctrl+Shift+P, F1" = "Show Command Palette"
"Ctrl+P" = "Quick Open, Go to File…"
"Ctrl+Shift+N" = "New window/instance"
"Ctrl+Shift+W" = "Close window/instance"
"Ctrl+," = "User Settings"
"<leader> Ctrl+S" = "Keyboard Shortcuts"

